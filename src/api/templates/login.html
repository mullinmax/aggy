{% extends "base.html" %}
{% block title %}Aggy - Sign In{% endblock %}

{% block body %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">A</div>
      <h1>Welcome to Aggy</h1>
      <p>Your personalized content aggregator</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" class="form-input" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
    </form>

    <form class="auth-form" id="signupForm" style="display:none" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="signupUser">Username</label>
        <input type="text" id="signupUser" class="form-input" placeholder="Choose a username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="signupPass">Password</label>
        <input type="password" id="signupPass" class="form-input" placeholder="Choose a password" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="signupPassConfirm">Confirm Password</label>
        <input type="password" id="signupPassConfirm" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // If already logged in, redirect to dashboard
  if (localStorage.getItem('aggy_token')) {
    window.location.href = '/app';
  }

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('authError').classList.remove('visible');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
      const data = await api.login(
        document.getElementById('loginUser').value,
        document.getElementById('loginPass').value
      );
      localStorage.setItem('aggy_token', data.access_token);
      window.location.href = '/app';
    } catch (err) {
      showError(err.message || 'Login failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    hideError();
    const pass = document.getElementById('signupPass').value;
    const confirm = document.getElementById('signupPassConfirm').value;
    if (pass !== confirm) {
      showError('Passwords do not match');
      return;
    }
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      await api.signup(
        document.getElementById('signupUser').value,
        pass
      );
      // Auto-login after signup
      const data = await api.login(
        document.getElementById('signupUser').value,
        pass
      );
      localStorage.setItem('aggy_token', data.access_token);
      window.location.href = '/app';
    } catch (err) {
      showError(err.message || 'Signup failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }
</script>
{% endblock %}
