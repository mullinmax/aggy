{% extends "base.html" %}
{% block title %}Aggy - Sign In{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card bg-base-200 shadow-xl w-full max-w-md">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="badge badge-lg badge-primary text-primary-content font-extrabold text-lg p-4 mb-4">A</div>
        <h1 class="text-2xl font-bold">Welcome to Aggy</h1>
        <p class="text-base-content/60 text-sm mt-1">Your personalized content aggregator</p>
      </div>

      <div role="tablist" class="tabs tabs-boxed mb-4">
        <a role="tab" class="tab tab-active" id="tabLogin" onclick="switchTab('login')">Sign In</a>
        <a role="tab" class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</a>
      </div>

      <div class="alert alert-error text-sm hidden" id="authError">
        <span id="authErrorText"></span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text" id="loginUser" class="input input-bordered w-full" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-control mb-4">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" id="loginPass" class="input input-bordered w-full" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginBtn">Sign In</button>
      </form>

      <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text" id="signupUser" class="input input-bordered w-full" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" id="signupPass" class="input input-bordered w-full" placeholder="Choose a password" required autocomplete="new-password">
        </div>
        <div class="form-control mb-4">
          <label class="label"><span class="label-text">Confirm Password</span></label>
          <input type="password" id="signupPassConfirm" class="input input-bordered w-full" placeholder="Confirm your password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full" id="signupBtn">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const sdk = new AggySDK();

  if (localStorage.getItem('aggy_token')) {
    window.location.href = '/app';
  }

  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('tab-active', tab === 'login');
    document.getElementById('tabSignup').classList.toggle('tab-active', tab === 'signup');
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
    document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('authError').classList.add('hidden');
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    document.getElementById('authErrorText').textContent = msg;
    el.classList.remove('hidden');
  }

  async function handleLogin(e) {
    e.preventDefault();
    document.getElementById('authError').classList.add('hidden');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Signing in...';
    try {
      const data = await sdk.authFormLogin({
        formData: {
          username: document.getElementById('loginUser').value,
          password: document.getElementById('loginPass').value,
        }
      });
      localStorage.setItem('aggy_token', data.access_token);
      window.location.href = '/app';
    } catch (err) {
      showError(err.message || 'Login failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    document.getElementById('authError').classList.add('hidden');
    const pass = document.getElementById('signupPass').value;
    if (pass !== document.getElementById('signupPassConfirm').value) {
      showError('Passwords do not match');
      return;
    }
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Creating account...';
    try {
      const username = document.getElementById('signupUser').value;
      await sdk.authSignup({ body: { username, password: pass } });
      const data = await sdk.authFormLogin({ formData: { username, password: pass } });
      localStorage.setItem('aggy_token', data.access_token);
      window.location.href = '/app';
    } catch (err) {
      showError(err.message || 'Signup failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }
</script>
{% endblock %}
