name: Run API Tests

on:
  pull_request:

jobs:
  # The extraction sidecar needs no database and no running service: its
  # rendition picker, its failure wording and its retry decision are all plain
  # functions of what yt-dlp handed back.
  ytdlp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run sidecar tests
      working-directory: src/ytdlp
      run: |
        pip install -r requirements.txt pytest
        pytest

    # The image builds happily with a module missing from it: nothing notices
    # until the container starts, in the deployment, and takes the service off
    # the network with it. Start the real image and ask it whether it is
    # alive, which is the only check that covers that.
    - name: The built image actually starts
      working-directory: src/ytdlp
      run: |
        docker build -t aggy-ytdlp-check .
        docker run --rm -d --name ytdlp-check -p 8000:8000 aggy-ytdlp-check
        for attempt in $(seq 30); do
          if curl -fsS http://localhost:8000/health; then
            echo "\nthe service answered"
            docker rm -f ytdlp-check
            exit 0
          fi
          sleep 2
        done
        echo "the service never answered:"
        docker logs ytdlp-check
        docker rm -f ytdlp-check
        exit 1

  test:
    runs-on: ubuntu-latest
    # A hung step (an apt mirror that never answers, a build that stalls)
    # otherwise sits here until the 6-hour job limit.
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The runner image ships Compose v2 as the `docker compose` CLI plugin, so
    # there is nothing to install -- `apt-get install docker-compose` pulled the
    # EOL v1 wrapper, and its `apt-get update` is what hung this job for hours.
    - name: Build and run tests
      # `up --abort-on-container-exit` stopped the stack the moment the flyway
      # container finished migrating, which is before pytest has run at all --
      # so this job reported success without executing a single test. Start
      # detached instead (depends_on still holds the test container back until
      # flyway completes), then wait on that container and exit with pytest's
      # own status.
      working-directory: src/api
      run: |
        compose_file="docker-compose.test.yml"
        docker compose -f $compose_file up --build -d

        # -a: Compose v2 hides exited containers from `ps` by default, and
        # a fast pytest run can finish before this line.
        container=$(docker compose -f $compose_file ps -aq test-aggy-api)
        if [ -z "$container" ]; then
          echo "test container never started"
          docker compose -f $compose_file logs
          exit 1
        fi

        status=$(docker wait "$container")
        docker logs "$container"

        docker compose -f $compose_file down
        exit "$status"
