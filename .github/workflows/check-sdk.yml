name: Check SDK Freshness

on:
  pull_request:

jobs:
  check-sdk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build API image
      run: docker build -f src/api/dockerfile -t aggy-sdk-check .

    - name: Verify SDK is up-to-date
      run: |
        docker run --rm aggy-sdk-check python /src/api/generate_sdk.py --check
